name: Build TWRP 14.1 - Arctic

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          echo "=== Disk space ==="
          df -h
          df -ih

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Verify Memory and Swap
        run: |
          free -h
          swapon --show
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools \
            unzip xz-utils zip zlib1g-dev python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" version

      - name: Initialize and synchronize TWRP source
        timeout-minutes: 240
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          echo "=== Initializing TWRP 14.1 manifest ==="
          repo init --verbose --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

          echo "=== Manifest initialized ==="
          git -C .repo/manifests log -1 --oneline || true

          echo "=== Resources before synchronization ==="
          free -h
          df -h /
          df -ih /

          echo "=== Starting source synchronization ==="

          (
            while sleep 60; do
              echo "=== SYNC HEARTBEAT $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
              echo "=== Memory ==="
              free -h
              echo "=== Disk ==="
              df -h /
              df -ih /
              echo "=== Active repo/git processes ==="
              pgrep -af 'repo|git|git-remote-https' || true
            done
          ) &
          heartbeat_pid=$!

          set +e
          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --fail-fast \
            --verbose \
            --depth=1 \
            -j2 2>&1 | tee "$GITHUB_WORKSPACE/repo-sync.log"
          sync_status=${PIPESTATUS[0]}
          set -e

          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true

          if [ "$sync_status" -ne 0 ]; then
            echo "ERROR: repo sync failed with exit code $sync_status"
            echo "=== Last 100 lines of repo sync log ==="
            tail -n 100 "$GITHUB_WORKSPACE/repo-sync.log"
            exit "$sync_status"
          fi

          echo "=== Source synchronization completed ==="
          free -h
          df -h /
          df -ih /

      - name: Add Arctic device tree
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/twrp"

          git clone --depth=1 \
            -b android-16 \
            https://github.com/lo93m/android_device_xiaomi_arctic.git \
            device/Xiaomi/arctic

          echo "=== Device tree cloned successfully ==="
          git -C device/Xiaomi/arctic log -1 --oneline
          echo "=== Device tree files ==="
          ls -la device/Xiaomi/arctic

      - name: Check build target
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/twrp"

          source build/envsetup.sh
          lunch twrp_arctic-ap2a-userdebug

      - name: Build vendor_boot
        timeout-minutes: 240
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export NINJA_HIGHMEM_NUM_JOBS=1

          echo "=== Resources before build ==="
          free -h
          swapon --show
          df -h /
          df -ih /

          source build/envsetup.sh
          lunch twrp_arctic-ap2a-userdebug

          echo "=== Starting vendor_boot build ==="
          mka -j2 vendorbootimage

          echo "=== Build command completed ==="
          find out/target/product/arctic -maxdepth 1 -type f \
            \( -name 'vendor_boot*.img' -o -name '*recovery*.img' \) \
            -exec ls -lh {} \;

      - name: Memory and disk diagnostics
        if: always()
        run: |
          echo "=== Memory ==="
          free -h || true

          echo "=== Swap ==="
          swapon --show || true

          echo "=== Memory pressure ==="
          cat /proc/pressure/memory || true

          echo "=== Disk space ==="
          df -h || true

          echo "=== Inode usage ==="
          df -ih || true

      - name: Upload build images and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arctic-twrp-build-output
          path: |
            twrp/out/target/product/arctic/vendor_boot*.img
            twrp/out/target/product/arctic/*recovery*.img
            repo-sync.log
          if-no-files-found: warn
          retention-days: 7
